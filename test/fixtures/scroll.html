<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scroll Fixture</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      .spacer { height: 2000px; background: #f0f0f0; }
      .footer { padding: 40px; background: #ddd; }
      button { padding: 8px 16px; margin: 8px; }
    </style>
  </head>
  <body>
    <header>
      <button id="top-btn" aria-label="top">Top button</button>
    </header>
    <div class="spacer">spacer</div>
    <footer class="footer">
      <button id="bottom-btn" aria-label="bottom">Bottom button</button>
      <a href="#" aria-label="bottom-link">Bottom link</a>
    </footer>
  </body>
</html>
